<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HabitFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <main class="auth-layout">
        <section class="auth-visual">
            <a class="brand brand-light" href="{{ url_for('login') }}">
                <span class="brand-icon">≈</span> HabitFlow
            </a>

            <div class="visual-content">
                <h1>Small steps.<br>Lasting change.</h1>
                <span class="auth-swoosh" aria-hidden="true"></span>
                <img
                    class="auth-illustration"
                    src="{{ url_for('static', filename='auth-illustration.svg') }}"
                    alt="Colorful abstract illustration about building healthy habits"
                >
            </div>
            <span class="auth-sparkle sparkle-one" aria-hidden="true">✦</span>
            <span class="auth-sparkle sparkle-two" aria-hidden="true">✦</span>
        </section>

        <section class="auth-form-side">
            <div class="auth-form-wrap">
                <div class="mobile-brand brand">
                    <span class="brand-icon">≈</span> HabitFlow
                </div>

                <div class="auth-heading">
                    <h2>Welcome back</h2>
                    <p>Your next small win starts here.</p>
                    <span class="auth-swoosh" aria-hidden="true"></span>
                </div>

                {% if error %}
                    <div class="alert" role="alert">{{ error }}</div>
                {% endif %}

                <form method="POST" action="{{ url_for('login') }}" class="auth-form">
                    <label for="email">Email address</label>
                    <div class="auth-input-wrap">
                        <span aria-hidden="true">✉</span>
                        <input
                            id="email"
                            type="email"
                            name="email"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <label for="password">Password</label>
                    <div class="auth-input-wrap">
                        <span aria-hidden="true">♙</span>
                        <input
                            id="password"
                            type="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" data-password-toggle="password">◉</button>
                    </div>

                    <button class="primary-button auth-button" type="submit">Log in</button>
                </form>

                <p class="auth-switch">
                    New to HabitFlow?
                    <a href="{{ url_for('register') }}">Create account</a>
                </p>
            </div>
        </section>
    </main>
    <script>
        document.querySelectorAll("[data-password-toggle]").forEach(button => {
            button.addEventListener("click", () => {
                const input = document.getElementById(button.dataset.passwordToggle);
                const showing = input.type === "password";
                input.type = showing ? "text" : "password";
                button.setAttribute("aria-pressed", String(showing));
                button.setAttribute("aria-label", showing ? "Hide password" : "Show password");
            });
        });
    </script>
</body>
</html>
